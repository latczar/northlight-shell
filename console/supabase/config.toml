# Supabase settings for the Northlight console. Push to a hosted project with:
#   npx supabase config push --project-ref <your-project-ref>
# Change site_url and additional_redirect_urls to your own console address first.
project_id = "northlight-console"

[auth]
enabled = true
# Supabase's default (free) email sends a link that returns here; /auth/confirm finishes the sign-in.
site_url = "https://northlight-console-ten.vercel.app/auth/confirm"
additional_redirect_urls = ["https://northlight-console-ten.vercel.app/auth/confirm"]
# Staff accounts are created by an admin. Nobody can sign themselves up.
enable_signup = false

[auth.email]
enabled = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# Needs custom SMTP on the free plan. Uncomment once SMTP is set.
# [auth.email.template.magic_link]
# subject = "Your Northlight sign-in code"
# content_path = "./supabase/templates/magic_link.html"
